name: Reusable Deploy Swarm

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/makepad-fr/alerteconso.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate target environment
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            production) ;;
            *)
              echo "Swarm deployment is only supported for production." >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify deployment image exists
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}:${{ inputs.image_tag }}"
          for attempt in $(seq 1 12); do
            if docker buildx imagetools inspect "${image_ref}" > /dev/null 2>&1; then
              exit 0
            fi
            echo "waiting for image ${image_ref} to become available (${attempt}/12)"
            sleep 10
          done

          docker buildx imagetools inspect "${image_ref}"

      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"

      - name: Prepare swarm bundle
        id: prep
        shell: bash
        env:
          DEPLOY_APP_NETWORK: ${{ secrets.DEPLOY_APP_NETWORK }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          release_tag="$(
            printf '%s' "${IMAGE_TAG}" \
              | tr -cs 'a-zA-Z0-9' '-' \
              | sed 's/^-*//; s/-*$//' \
              | cut -c1-12
          )"
          if [[ -z "${release_tag}" ]]; then
            release_tag="image"
          fi
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${release_tag}"
          database_secret_name="alerteconso_prod_database_url_${release_id}"
          stack_root="${RUNNER_TEMP}/stack-bundle"
          env_dir="${stack_root}/deploy/envs/${{ inputs.environment }}"

          mkdir -p "${env_dir}"
          cp deploy/compose.yml "${stack_root}/deploy/compose.yml"
          cp "deploy/envs/${{ inputs.environment }}/compose.yml" "${env_dir}/compose.yml"
          cp "deploy/envs/${{ inputs.environment }}/.env.app" "${env_dir}/.env.app"
          {
            echo "ALERTECONSO_IMAGE=${IMAGE_NAME}:${IMAGE_TAG}"
            echo "DEPLOY_APP_NETWORK=${DEPLOY_APP_NETWORK}"
            echo "ALERTECONSO_DATABASE_URL_SECRET=${database_secret_name}"
          } > "${env_dir}/.env.deploy"

          echo "database_secret_name=${database_secret_name}" >> "${GITHUB_OUTPUT}"

      - name: Ensure database role and database exist
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          REMOTE_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_SSH_USER }}
          ALERTECONSO_DATABASE_ADMIN_URL: ${{ secrets.ALERTECONSO_DATABASE_ADMIN_URL }}
          ALERTECONSO_DATABASE_NAME: ${{ secrets.ALERTECONSO_DATABASE_NAME }}
          ALERTECONSO_DATABASE_USER: ${{ secrets.ALERTECONSO_DATABASE_USER }}
          ALERTECONSO_DATABASE_PASSWORD: ${{ secrets.ALERTECONSO_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          remote_port=${REMOTE_PORT:-22}
          ssh_opts=(-o StrictHostKeyChecking=accept-new -p "${remote_port}")
          remote_target="${REMOTE_USER}@${REMOTE_HOST}"

          ssh "${ssh_opts[@]}" "${remote_target}" \
            ALERTECONSO_DATABASE_ADMIN_URL="${ALERTECONSO_DATABASE_ADMIN_URL}" \
            ALERTECONSO_DATABASE_NAME="${ALERTECONSO_DATABASE_NAME}" \
            ALERTECONSO_DATABASE_USER="${ALERTECONSO_DATABASE_USER}" \
            ALERTECONSO_DATABASE_PASSWORD="${ALERTECONSO_DATABASE_PASSWORD}" \
            'bash -se' <<'EOF'
          set -euo pipefail
          work_dir=$(mktemp -d)
          trap 'rm -rf "${work_dir}"' EXIT

          cat > "${work_dir}/ensure-database.sql" <<'SQL'
          SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'db_user', :'db_password')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'db_user') \gexec
          SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'db_user', :'db_password') \gexec
          SELECT format('CREATE DATABASE %I OWNER %I', :'db_name', :'db_user')
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db_name') \gexec
          SELECT format('ALTER DATABASE %I OWNER TO %I', :'db_name', :'db_user') \gexec
          SQL

          docker run --rm \
            -v "${work_dir}:/runner:ro" \
            postgres:16-alpine \
            psql "${ALERTECONSO_DATABASE_ADMIN_URL}" \
              -v ON_ERROR_STOP=1 \
              -v db_name="${ALERTECONSO_DATABASE_NAME}" \
              -v db_user="${ALERTECONSO_DATABASE_USER}" \
              -v db_password="${ALERTECONSO_DATABASE_PASSWORD}" \
              -f /runner/ensure-database.sql
          EOF

      - name: Apply schema
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          REMOTE_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_SSH_USER }}
          ALERTECONSO_DATABASE_HOST: ${{ secrets.ALERTECONSO_DATABASE_HOST }}
          ALERTECONSO_DATABASE_PORT: ${{ secrets.ALERTECONSO_DATABASE_PORT }}
          ALERTECONSO_DATABASE_NAME: ${{ secrets.ALERTECONSO_DATABASE_NAME }}
          ALERTECONSO_DATABASE_USER: ${{ secrets.ALERTECONSO_DATABASE_USER }}
          ALERTECONSO_DATABASE_PASSWORD: ${{ secrets.ALERTECONSO_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          remote_port=${REMOTE_PORT:-22}
          ssh_opts=(-o StrictHostKeyChecking=accept-new -p "${remote_port}")
          scp_opts=(-o StrictHostKeyChecking=accept-new -P "${remote_port}")
          remote_target="${REMOTE_USER}@${REMOTE_HOST}"
          remote_schema="/tmp/alerteconso-schema-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sql"

          scp "${scp_opts[@]}" "${GITHUB_WORKSPACE}/schema.sql" "${remote_target}:${remote_schema}"

          ssh "${ssh_opts[@]}" "${remote_target}" \
            ALERTECONSO_DATABASE_HOST="${ALERTECONSO_DATABASE_HOST}" \
            ALERTECONSO_DATABASE_PORT="${ALERTECONSO_DATABASE_PORT}" \
            ALERTECONSO_DATABASE_NAME="${ALERTECONSO_DATABASE_NAME}" \
            ALERTECONSO_DATABASE_USER="${ALERTECONSO_DATABASE_USER}" \
            ALERTECONSO_DATABASE_PASSWORD="${ALERTECONSO_DATABASE_PASSWORD}" \
            REMOTE_SCHEMA="${remote_schema}" \
            'bash -se' <<'EOF'
          set -euo pipefail
          cleanup() {
            rm -f "${REMOTE_SCHEMA}"
          }
          trap cleanup EXIT

          docker run --rm \
            -e PGHOST="${ALERTECONSO_DATABASE_HOST}" \
            -e PGPORT="${ALERTECONSO_DATABASE_PORT}" \
            -e PGDATABASE="${ALERTECONSO_DATABASE_NAME}" \
            -e PGUSER="${ALERTECONSO_DATABASE_USER}" \
            -e PGPASSWORD="${ALERTECONSO_DATABASE_PASSWORD}" \
            -e PGSSLMODE=disable \
            -v "/tmp:/workspace:ro" \
            postgres:16-alpine \
            psql -v ON_ERROR_STOP=1 -f "/workspace/$(basename "${REMOTE_SCHEMA}")"
          EOF

      - name: Create swarm secret
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          REMOTE_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_SSH_USER }}
          ALERTECONSO_DATABASE_HOST: ${{ secrets.ALERTECONSO_DATABASE_HOST }}
          ALERTECONSO_DATABASE_PORT: ${{ secrets.ALERTECONSO_DATABASE_PORT }}
          ALERTECONSO_DATABASE_NAME: ${{ secrets.ALERTECONSO_DATABASE_NAME }}
          ALERTECONSO_DATABASE_USER: ${{ secrets.ALERTECONSO_DATABASE_USER }}
          ALERTECONSO_DATABASE_PASSWORD: ${{ secrets.ALERTECONSO_DATABASE_PASSWORD }}
          DATABASE_SECRET_NAME: ${{ steps.prep.outputs.database_secret_name }}
        run: |
          set -euo pipefail
          remote_port=${REMOTE_PORT:-22}
          ssh_opts=(-o StrictHostKeyChecking=accept-new -p "${remote_port}")
          remote_target="${REMOTE_USER}@${REMOTE_HOST}"
          database_url="$(python3 -c 'from urllib.parse import quote; import os; print("postgres://{user}:{password}@{host}:{port}/{database}?sslmode=disable".format(user=quote(os.environ["ALERTECONSO_DATABASE_USER"], safe=""), password=quote(os.environ["ALERTECONSO_DATABASE_PASSWORD"], safe=""), host=os.environ["ALERTECONSO_DATABASE_HOST"], port=os.environ["ALERTECONSO_DATABASE_PORT"], database=quote(os.environ["ALERTECONSO_DATABASE_NAME"], safe="")))' )"

          printf '%s' "${database_url}" | ssh "${ssh_opts[@]}" "${remote_target}" \
            "docker secret create --label app=alerteconso --label environment=${{ inputs.environment }} \"${DATABASE_SECRET_NAME}\" - >/dev/null"

      - name: Deploy via Docker Swarm
        shell: bash
        env:
          STACK_ROOT: ${{ runner.temp }}/stack-bundle
          REMOTE_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          REMOTE_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_SSH_USER }}
          REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          STACK_NAME: ${{ secrets.DEPLOY_STACK_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME || secrets.GHCR_PULL_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN || secrets.GHCR_PULL_TOKEN || github.token }}
        run: |
          set -euo pipefail
          : "${REMOTE_HOST:?}" "${REMOTE_USER:?}" "${REMOTE_DIR:?}" "${STACK_ROOT:?}" "${STACK_NAME:?}" "${IMAGE_TAG:?}" "${GHCR_USERNAME:?}" "${GHCR_TOKEN:?}"
          remote_port=${REMOTE_PORT:-22}
          ssh_opts=(-o StrictHostKeyChecking=accept-new -p "${remote_port}")
          scp_opts=(-o StrictHostKeyChecking=accept-new -P "${remote_port}")
          remote_target="${REMOTE_USER}@${REMOTE_HOST}"

          ssh "${ssh_opts[@]}" "${remote_target}" mkdir -p "${REMOTE_DIR}/deploy/envs/${{ inputs.environment }}"
          scp "${scp_opts[@]}" "${STACK_ROOT}/deploy/compose.yml" "${remote_target}:${REMOTE_DIR}/deploy/compose.yml"
          scp "${scp_opts[@]}" "${STACK_ROOT}/deploy/envs/${{ inputs.environment }}/compose.yml" "${remote_target}:${REMOTE_DIR}/deploy/envs/${{ inputs.environment }}/compose.yml"
          scp "${scp_opts[@]}" "${STACK_ROOT}/deploy/envs/${{ inputs.environment }}/.env.app" "${remote_target}:${REMOTE_DIR}/deploy/envs/${{ inputs.environment }}/.env.app"
          scp "${scp_opts[@]}" "${STACK_ROOT}/deploy/envs/${{ inputs.environment }}/.env.deploy" "${remote_target}:${REMOTE_DIR}/deploy/envs/${{ inputs.environment }}/.env.deploy"

          printf '%s' "${GHCR_TOKEN}" \
            | ssh "${ssh_opts[@]}" "${remote_target}" docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          ssh "${ssh_opts[@]}" "${remote_target}" bash -se -- "${REMOTE_DIR}" "${STACK_NAME}" "${{ inputs.environment }}" "${IMAGE_NAME}:${IMAGE_TAG}" <<'EOF'
          set -euo pipefail
          remote_dir=$1
          stack_name=$2
          deploy_env=$3
          image_ref=$4
          env_dir="${remote_dir}/deploy/envs/${deploy_env}"
          env_app="${env_dir}/.env.app"
          env_deploy="${env_dir}/.env.deploy"
          app_network=$(grep '^DEPLOY_APP_NETWORK=' "${env_deploy}" | tail -n 1 | cut -d= -f2-)

          docker network inspect "${app_network}" >/dev/null 2>&1 \
            || docker network create --driver overlay --attachable "${app_network}"

          for attempt in {1..12}; do
            if docker pull "${image_ref}" >/dev/null 2>&1; then
              break
            fi
            if (( attempt == 12 )); then
              echo "Timed out waiting for ${image_ref} to be pullable on ${HOSTNAME}." >&2
              exit 1
            fi
            sleep 10
          done

          docker compose \
            --env-file "${env_app}" \
            --env-file "${env_deploy}" \
            -f "${remote_dir}/deploy/compose.yml" \
            -f "${env_dir}/compose.yml" \
            config | sed '/^name: /d' > "${remote_dir}/stack.yml"

          docker stack deploy --with-registry-auth --compose-file "${remote_dir}/stack.yml" "${stack_name}"

          mapfile -t stack_services < <(docker stack services "${stack_name}" --format '{{.Name}}')
          for service in "${stack_services[@]}"; do
            deadline=$((SECONDS + 180))
            while (( SECONDS < deadline )); do
              replicas=$(docker service ls --filter "name=${service}" --format '{{.Replicas}}')
              desired=${replicas#*/}
              running=${replicas%%/*}
              update_state=$(docker service inspect "${service}" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')
              update_message=$(docker service inspect "${service}" --format '{{if .UpdateStatus}}{{.UpdateStatus.Message}}{{end}}')

              if [[ "${update_state}" == rollback_* ]]; then
                echo "Service ${service} rolled back: ${update_message}" >&2
                docker service ps "${service}" --no-trunc >&2 || true
                exit 1
              fi

              if [[ -n "${desired}" && "${desired}" != "0" && "${running}" == "${desired}" ]]; then
                break
              fi

              sleep 5
            done

            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for ${service} to reach ${desired} replicas." >&2
              docker service ps "${service}" --no-trunc >&2 || true
              exit 1
            fi
          done

          mapfile -t old_secrets < <(
            (
              docker secret ls --format '{{.Name}}' \
                | grep '^alerteconso_prod_database_url_' \
                | while read -r secret; do
                    created_at=$(docker secret inspect "${secret}" --format '{{.CreatedAt}}')
                    printf '%s\t%s\n' "${created_at}" "${secret}"
                  done \
                | sort -r \
                | cut -f2
            ) || true
          )
          if ((${#old_secrets[@]} > 2)); then
            for secret in "${old_secrets[@]:2}"; do
              docker secret rm "${secret}" >/dev/null 2>&1 || true
            done
          fi
          EOF
