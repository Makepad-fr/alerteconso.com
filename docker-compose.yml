services:
  rappel-api:
    build: .
    ports:
      - "9092:8080"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://rappeluser:rappelpass@db:5432/rappeldb?sslmode=disable
    networks:
      - rappelconso-network
      - caddy-network-rappelconso

  db:
    image: postgres:17
    container_name: rappelconso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rappeluser
      POSTGRES_PASSWORD: rappelpass
      POSTGRES_DB: rappeldb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rappelconso-network

networks:
  rappelconso-network:
    driver: bridge
  caddy-network-rappelconso:
    driver: bridge

volumes:
  pgdata:
